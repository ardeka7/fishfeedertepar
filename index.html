<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans antialiased">

    <nav class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-400 flex items-center gap-2">
                <i class="fa-solid fa-fish-fins animate-bounce"></i> 
                FishFeeder <span class="text-white font-light text-sm bg-slate-700 px-2 py-0.5 rounded">IoT</span>
            </h1>
            <div id="status-koneksi" class="text-xs md:text-sm bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full border border-amber-500/30 font-medium">
                <i class="fa-solid fa-circle-notch animate-spin mr-1"></i> Menghubungkan...
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 max-w-5xl">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between transition hover:border-teal-500/50 duration-300">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Kapasitas Sisa Pakan</p>
                    <h3 id="val-volume" class="text-4xl font-black mt-2 text-teal-400">0%</h3>
                    <p id="val-jarak-raw" class="text-xs text-slate-500 mt-1">Jarak: 0 cm</p>
                </div>
                <div class="bg-teal-500/10 p-4 rounded-xl border border-teal-500/20 text-teal-400">
                    <i class="fa-solid fa-fill-drip text-3xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between transition hover:border-blue-500/50 duration-300">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Suhu Sekitar Wadah</p>
                    <h3 id="val-kelembapan" class="text-4xl font-black mt-2 text-blue-400">0°C</h3>
                </div>
                <div class="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20 text-blue-400">
                    <i class="fa-solid fa-temperature-half text-3xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-between">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Kontrol Manual Katup</p>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-400">Durasi Buka:</label>
                        <span id="label-durasi-manual" class="text-xs font-bold text-amber-400">2 Detik</span>
                    </div>
                    <input type="range" id="slider-durasi-manual" min="1" max="10" value="2" oninput="updateLabelDurasi()" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500 mb-4">
                </div>
                <button onclick="beriPakanManual()" id="btn-servo" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-utensils"></i> Beri Pakan Sekarang
                </button>
            </div>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="text-base md:text-lg font-bold text-slate-300 mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-teal-400"></i> Atur Jadwal Makan 1 (V6)
                </h3>
                <div class="space-y-4">
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-slate-400 w-24">Jam Makan:</span>
                        <input type="time" id="input-jadwal1" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-center font-semibold focus:outline-none focus:border-teal-400">
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-slate-400 w-24">Durasi Katup:</span>
                        <input type="number" id="durasi-jadwal1" min="1" max="10" value="2" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-center font-semibold focus:outline-none focus:border-teal-400">
                        <span class="text-xs text-slate-400">Detik</span>
                    </div>
                    <button onclick="simpanJadwal('V6', 'input-jadwal1', 'durasi-jadwal1')" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold py-2.5 rounded-xl transition duration-200">
                        Simpan Jadwal 1
                    </button>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="text-base md:text-lg font-bold text-slate-300 mb-4 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-blue-400"></i> Atur Jadwal Makan 2 (V7)
                </h3>
                <div class="space-y-4">
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-slate-400 w-24">Jam Makan:</span>
                        <input type="time" id="input-jadwal2" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-center font-semibold focus:outline-none focus:border-blue-400">
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-slate-400 w-24">Durasi Katup:</span>
                        <input type="number" id="durasi-jadwal2" min="1" max="10" value="2" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-center font-semibold focus:outline-none focus:border-blue-400">
                        <span class="text-xs text-slate-400">Detik</span>
                    </div>
                    <button onclick="simpanJadwal('V7', 'input-jadwal2', 'durasi-jadwal2')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl transition duration-200">
                        Simpan Jadwal 2
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 p-5 md:p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base md:text-lg font-bold text-slate-300">
                    <i class="fa-solid fa-chart-line mr-2 text-teal-400"></i>Grafik Monitoring Real-Time
                </h3>
                <span class="text-xs text-slate-500 bg-slate-900 px-2 py-1 rounded">Update: Tiap 3 Detik</span>
            </div>
            <div class="relative h-64 md:h-80 w-full">
                <canvas id="iotChart"></canvas>
            </div>
        </div>

    </main>

    <script>
        const BLYNK_TOKEN = "M9tF9T0A8oG40ZARYeRdMbiZdQ2-5pAO"; 
        const BLYNK_URL = "https://blynk.cloud/external/api"; 

        // Update teks keterangan slider durasi manual
        function updateLabelDurasi() {
            const val = document.getElementById('slider-durasi-manual').value;
            document.getElementById('label-durasi-manual').innerText = val + " Detik";
        }

        // Inisialisasi Grafik Menggunakan Chart.js
        const ctx = document.getElementById('iotChart').getContext('2d');
        const iotChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: 'Sisa Pakan (%)',
                        data: [],
                        borderColor: '#2dd4bf', 
                        backgroundColor: 'rgba(45, 212, 191, 0.05)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Suhu Wadah (°C)',
                        data: [],
                        borderColor: '#60a5fa', 
                        backgroundColor: 'rgba(96, 165, 250, 0.05)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { min: 0, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { labels: { color: '#f1f5f9', font: { weight: 'bold' } } } }
            }
        });

        // Ambil Data Sensor Real-Time via API Blynk
        async function fetchBlynkData() {
            try {
                const [resSuhu, resJarak] = await Promise.all([
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V1`),
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V3`)
                ]);
                
                const suhuVal = parseFloat(await resSuhu.text());
                const jarakRaw = parseFloat(await resJarak.text());

                // Konversi jarak ultrasonik cm ke persentase (%) wadah pakan
                const tinggiMaksimalWadah = 30; // Batas maksimal tangki pakan Anda
                let sisaPakanPersen = ((tinggiMaksimalWadah - jarakRaw) / tinggiMaksimalWadah) * 100;
                
                if (sisaPakanPersen > 100) sisaPakanPersen = 100;
                if (sisaPakanPersen < 0 || isNaN(sisaPakanPersen)) sisaPakanPersen = 0;

                // Tampilkan data teks ke Web
                if (!isNaN(suhuVal)) document.getElementById('val-kelembapan').innerText = suhuVal.toFixed(1) + "°C";
                if (!isNaN(jarakRaw)) {
                    document.getElementById('val-volume').innerText = Math.round(sisaPakanPersen) + "%";
                    document.getElementById('val-jarak-raw').innerText = `Jarak: ${jarakRaw} cm`;
                }

                // Update Grafik
                const waktuSekarang = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (iotChart.data.labels.length > 8) { 
                    iotChart.data.labels.shift();
                    iotChart.data.datasets[0].data.shift();
                    iotChart.data.datasets[1].data.shift();
                }
                iotChart.data.labels.push(waktuSekarang);
                iotChart.data.datasets[0].data.push(Math.round(sisaPakanPersen));
                iotChart.data.datasets[1].data.push(suhuVal || 0);
                iotChart.update();

                document.getElementById('status-koneksi').innerHTML = '<i class="fa-solid fa-circle text-xs mr-1 animate-pulse"></i> Berhasil Sinkron';
                document.getElementById('status-koneksi').className = "text-sm bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30 font-medium";

            } catch (error) {
                document.getElementById('status-koneksi').innerHTML = '<i class="fa-solid fa-circle-exclamation text-xs mr-1"></i> Putus Koneksi';
                document.getElementById('status-koneksi').className = "text-sm bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full border border-rose-500/30 font-medium";
            }
        }

        // Ambil pengaturan yang ada di Blynk Cloud saat web dimuat pertama kali
        async function loadSavedData() {
            try {
                const [resV6, resV7, resV4] = await Promise.all([
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V6`),
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V7`),
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V4`)
                ]);
                const t1 = await resV6.text();
                const t2 = await resV7.text();
                const dManual = await resV4.text();
                
                if(t1 && t1.includes(":")) document.getElementById('input-jadwal1').value = t1.trim().substring(0,5);
                if(t2 && t2.includes(":")) document.getElementById('input-jadwal2').value = t2.trim().substring(0,5);
                if(dManual && !isNaN(dManual)) {
                    document.getElementById('slider-durasi-manual').value = parseInt(dManual);
                    updateLabelDurasi();
                }
            } catch(e) { console.log("Gagal memuat konfigurasi awal."); }
        }

        // Simpan Jam Jadwal Makan dan Kirim Durasi Makan ke V4
        async function simpanJadwal(virtualPin, inputTimeId, inputDurationId) {
            const waktuSaran = document.getElementById(inputTimeId).value;
            const durasiDetik = document.getElementById(inputDurationId).value;

            if (!waktuSaran || !durasiDetik) {
                alert("Mohon isi waktu jam dan nilai durasi pakan!");
                return;
            }

            try {
                const formatBlynkTime = `${waktuSaran}:00`;
                // 1. Kirim data Jam Jadwal ke Pin V6/V7
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&${virtualPin}=${encodeURIComponent(formatBlynkTime)}`);
                // 2. Kirim durasi katup pakan ke Pin V4 feed_duration
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V4=${durasiDetik}`);
                
                alert(`Sukses! Jadwal diset jam ${waktuSaran} dengan durasi katup ${durasiDetik} detik.`);
            } catch (error) {
                alert("Gagal memperbarui jadwal.");
            }
        }

        // Tombol Aksi Pemberian Pakan Manual dengan Pembacaan Dinamis Slider V4
        async function beriPakanManual() {
            const btn = document.getElementById('btn-servo');
            const durasiMiliDetik = parseInt(document.getElementById('slider-durasi-manual').value) * 1000;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Memproses Alat...';

            try {
                // Sinkronkan nilai slider ke pin V4 di Cloud Blynk terlebih dahulu
                const durasiDetik = durasiMiliDetik / 1000;
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V4=${durasiDetik}`);

                // Jalankan pergerakan katup servo via V0
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V0=1`);
                await new Promise(resolve => setTimeout(resolve, durasiMiliDetik));
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V0=0`);
                
                alert("Pakan manual berhasil dijatuhkan!");
            } catch (error) {
                alert("Gagal mengontrol alat.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-utensils"></i> Beri Pakan Sekarang';
            }
        }

        // Jalankan sistem looping berkala
        setInterval(fetchBlynkData, 3000);
        fetchBlynkData();
        loadSavedData();
    </script>
</body>
</html>
