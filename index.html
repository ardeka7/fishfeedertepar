<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fish Feeder Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans antialiased">

    <nav class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-400 flex items-center gap-2">
                <i class="fa-solid fa-fish-fins animate-bounce"></i> 
                FishFeeder <span class="text-white font-light text-sm bg-slate-700 px-2 py-0.5 rounded">IoT</span>
            </h1>
            <div id="status-koneksi" class="text-xs md:text-sm bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full border border-amber-500/30 font-medium">
                <i class="fa-solid fa-circle-notch animate-spin mr-1"></i> Menghubungkan ke Alat...
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 max-w-5xl">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between transition hover:border-teal-500/50 duration-300">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Kapasitas Sisa Pakan</p>
                    <h3 id="val-volume" class="text-4xl font-black mt-2 text-teal-400">0%</h3>
                </div>
                <div class="bg-teal-500/10 p-4 rounded-xl border border-teal-500/20 text-teal-400">
                    <i class="fa-solid fa-fill-drip text-3xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex items-center justify-between transition hover:border-blue-500/50 duration-300">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Suhu Sekitar Wadah</p>
                    <h3 id="val-kelembapan" class="text-4xl font-black mt-2 text-blue-400">0°C</h3>
                </div>
                <div class="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20 text-blue-400">
                    <i class="fa-solid fa-temperature-half text-3xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-center">
                <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-3">Kontrol Manual Katup</p>
                <button onclick="beriPakan()" id="btn-servo" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-utensils"></i> Beri Pakan Sekarang
                </button>
            </div>

        </div>

        <div class="bg-slate-800 p-5 md:p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base md:text-lg font-bold text-slate-300">
                    <i class="fa-solid fa-chart-line mr-2 text-teal-400"></i>Grafik Monitoring Real-Time
                </h3>
                <span class="text-xs text-slate-500 bg-slate-900 px-2 py-1 rounded">Update: Tiap 3 Detik</span>
            </div>
            <div class="relative h-64 md:h-80 w-full">
                <canvas id="iotChart"></canvas>
            </div>
        </div>

    </main>

    <script>
        // Config Utama Sinkronisasi Token Blynk Anda
        const BLYNK_TOKEN = "M9tF9T0A8oG40ZARYeRdMbiZdQ2-5pAO"; 
        const BLYNK_URL = "https://blynk.cloud/external/api"; 

        // Inisialisasi Grafik Menggunakan Chart.js
        const ctx = document.getElementById('iotChart').getContext('2d');
        const iotChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: 'Sisa Pakan (%)',
                        data: [],
                        borderColor: '#2dd4bf', 
                        backgroundColor: 'rgba(45, 212, 191, 0.05)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Suhu Wadah (°C)',
                        data: [],
                        borderColor: '#60a5fa', 
                        backgroundColor: 'rgba(96, 165, 250, 0.05)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        min: 0, 
                        max: 100, 
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: { 
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { 
                        labels: { color: '#f1f5f9', font: { weight: 'bold' } } 
                    }
                }
            }
        });

        // Fungsi Ambil Data Sensor (V1 Suhu & V3 Jarak) secara Real-Time via API Blynk
        async function fetchBlynkData() {
            try {
                // Request paralel ke Blynk Cloud
                const [resSuhu, resJarak] = await Promise.all([
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V1`),
                    fetch(`${BLYNK_URL}/get?token=${BLYNK_TOKEN}&V3`)
                ]);
                
                const suhuVal = parseFloat(await resSuhu.text());
                const jarakRaw = parseFloat(await resJarak.text());

                // Mengonversi jarak cm (V3) menjadi bentuk persentase kapasitas wadah pakan
                // Asumsi: Jarak sensor ke dasar wadah kosong = 30cm, wadah penuh = 3cm
                const tinggiMaksimalWadah = 30; 
                let sisaPakanPersen = ((tinggiMaksimalWadah - jarakRaw) / tinggiMaksimalWadah) * 100;
                
                // Pembatasan logika matematika persentase agar selalu di range 0 - 100%
                if (sisaPakanPersen > 100) sisaPakanPersen = 100;
                if (sisaPakanPersen < 0 || isNaN(sisaPakanPersen)) sisaPakanPersen = 0;

                // Tampilkan data teks ke Web
                if (!isNaN(suhuVal)) document.getElementById('val-kelembapan').innerText = suhuVal.toFixed(1) + "°C";
                document.getElementById('val-volume').innerText = Math.round(sisaPakanPersen) + "%";

                // Dapatkan waktu lokal saat ini (Jam:Menit:Detik)
                const waktuSekarang = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                // Batasi jumlah titik grafik maksimal 8 data terakhir agar rapi di layar HP
                if (iotChart.data.labels.length > 8) { 
                    iotChart.data.labels.shift();
                    iotChart.data.datasets[0].data.shift();
                    iotChart.data.datasets[1].data.shift();
                }

                // Masukkan data baru ke bagan grafik
                iotChart.data.labels.push(waktuSekarang);
                iotChart.data.datasets[0].data.push(Math.round(sisaPakanPersen));
                iotChart.data.datasets[1].data.push(suhuVal || 0);
                iotChart.update();

                // Set status bar menjadi hijau (Berhasil Sinkron)
                document.getElementById('status-koneksi').innerHTML = '<i class="fa-solid fa-circle text-xs mr-1 animate-pulse"></i> Berhasil Sinkron';
                document.getElementById('status-koneksi').className = "text-sm bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/30 font-medium";

            } catch (error) {
                console.error("Gagal sinkronisasi data Blynk:", error);
                document.getElementById('status-koneksi').innerHTML = '<i class="fa-solid fa-circle-exclamation text-xs mr-1"></i> Putus Koneksi';
                document.getElementById('status-koneksi').className = "text-sm bg-rose-500/20 text-rose-400 px-3 py-1 rounded-full border border-rose-500/30 font-medium";
            }
        }

        // Fungsi Otomatisasi Tombol Aksi Pemberian Pakan (Menembak ke V0 manual_feed)
        async function beriPakan() {
            const btn = document.getElementById('btn-servo');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Memproses Alat...';

            try {
                // 1. Kirim sinyal 1 ke V0 untuk MEMBUKA katup servo otomatis
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V0=1`);
                
                // Beri waktu tunda selama 2 detik untuk proses menjatuhkan pakan
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // 2. Kirim sinyal 0 ke V0 untuk MENUTUP kembali katup servo otomatis
                await fetch(`${BLYNK_URL}/update?token=${BLYNK_TOKEN}&V0=0`);
                
                alert("Perintah Terkirim! Pakan berhasil dijatuhkan.");
            } catch (error) {
                alert("Gagal terhubung dengan alat. Periksa koneksi internet.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-utensils"></i> Beri Pakan Sekarang';
            }
        }

        // Jalankan siklus monitoring penarikan data berkala tiap 3 detik
        setInterval(fetchBlynkData, 3000);
        fetchBlynkData(); // Eksekusi pertama kali saat halaman dibuka
    </script>
</body>
</html>
